<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Quản trị — REWATCH</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@500&display=swap"
      rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
  </head>

  <body>
    <header>
      <a class="logo" href="index.html">
        <strong>RE</strong>WATCH
      </a>

      <nav>
        <a href="index.html">Xem website</a>
      </nav>
    </header>

    <main class="admin-page">
      <section class="login-panel" id="login-panel">
        <span class="kicker">REWATCH ADMIN</span>
        <h1>Đăng nhập quản trị</h1>

        <form id="login-form">
          <label for="admin-email">Email</label>
          <input
            id="admin-email"
            type="email"
            autocomplete="email"
            required
          >

          <label for="admin-password">Mật khẩu</label>
          <input
            id="admin-password"
            type="password"
            autocomplete="current-password"
            required
          >

          <button type="submit">Đăng nhập</button>

          <p id="login-message" role="status"></p>
        </form>
      </section>

      <section class="admin-dashboard" id="admin-dashboard" hidden>
        <div class="admin-heading">
          <div>
            <span class="kicker">TRANG QUẢN TRỊ</span>
            <h1>Quản lý giá thu mua</h1>
            <p id="admin-user"></p>
          </div>

          <div class="admin-heading-actions">
            <a href="index.html" target="_blank">Xem website</a>
            <button id="logout-button" type="button">Đăng xuất</button>
          </div>
        </div>

        <div class="admin-toolbar">
          <input
            id="price-search"
            type="search"
            placeholder="Tìm Reference hoặc tên đồng hồ"
          >

          <button id="reload-prices" type="button">
            Tải lại dữ liệu
          </button>
        </div>

        <div class="admin-table-wrapper">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Reference</th>
                <th>Đồng hồ</th>
                <th>Chế độ</th>
                <th>Giá tự động</th>
                <th>Giá chỉnh tay</th>
                <th>Giá đang hiển thị</th>
                <th>Thao tác</th>
              </tr>
            </thead>

            <tbody id="price-table-body"></tbody>
          </table>
        </div>

        <p id="admin-message" role="status"></p>
        <section class="admin-products-section">
  <div class="admin-section-heading">
    <div>
      <span class="kicker">HÀNG CÓ SẴN</span>
      <h2>Quản lý sản phẩm</h2>
    </div>

    <button id="new-product-button" type="button">
      Thêm sản phẩm mới
    </button>
  </div>

  <form id="product-admin-form" hidden>
    <input id="editing-product-id" type="hidden">

    <div class="admin-form-grid">
      <label>
        Mã quản lý
       <input id="product-id-input" type="text" value="Tự động tạo khi lưu" readonly>
      </label>

      <label>
        Thương hiệu
        <input
          id="product-brand-input"
          type="text"
          placeholder="Ví dụ: Rolex"
          required
        >
      </label>

      <label>
        Tên sản phẩm
        <input
          id="product-name-input"
          type="text"
          placeholder="Ví dụ: Submariner Date"
          required
        >
      </label>

      <label>
        Reference
        <input
          id="product-reference-input"
          type="text"
          placeholder="Ví dụ: 126610LN"
          required
        >
      </label>

      <label>
        Giá bán (triệu VND)
        <input
          id="product-price-input"
          type="number"
          min="0"
          step="1"
          required
        >
      </label>

      <label>
        Tình trạng
        <input
          id="product-condition-input"
          type="text"
          placeholder="Chưa sử dụng"
        >
      </label>

      <label>
        Năm sản xuất
        <input
          id="product-year-input"
          type="text"
          placeholder="2024"
        >
      </label>

      <label>
        Hộp
        <select id="product-box-input">
          <option value="Có">Có</option>
          <option value="Không">Không</option>
          <option value="Liên hệ">Liên hệ</option>
        </select>
      </label>

      <label>
        Giấy tờ
        <select id="product-papers-input">
          <option value="Có">Có</option>
          <option value="Không">Không</option>
          <option value="Liên hệ">Liên hệ</option>
        </select>
      </label>

      <label>
        Trạng thái
        <select id="product-status-input">
          <option value="available">Đang bán</option>
          <option value="sold">Đã bán</option>
          <option value="hidden">Ẩn sản phẩm</option>
        </select>
      </label>
    </div>

    <label class="admin-description-field">
      Mô tả sản phẩm
      <textarea
        id="product-description-input"
        rows="4"
      ></textarea>
    </label>

    <label class="admin-image-field">
      Ảnh sản phẩm
      <input
        id="product-images-input"
        type="file"
        accept="image/jpeg,image/png,image/webp,image/avif"
        multiple
      >
      <small>
        Có thể chọn nhiều ảnh. Mỗi ảnh tối đa 10 MB.
      </small>
    </label>

    <div class="admin-form-actions">
      <button type="submit">Lưu sản phẩm</button>

      <button id="cancel-product-button" type="button">
        Hủy
      </button>
    </div>
  </form>

  <div class="admin-table-wrapper">
    <table class="admin-table product-admin-table">
      <thead>
        <tr>
          <th>Mã</th>
          <th>Thương hiệu</th>
          <th>Sản phẩm</th>
          <th>Reference</th>
          <th>Giá bán</th>
          <th>Trạng thái</th>
          <th>Thao tác</th>
        </tr>
      </thead>

      <tbody id="product-table-body"></tbody>
    </table>
  </div>

  <p id="product-admin-message" role="status"></p>
</section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
