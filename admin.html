<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Quản trị — REWATCH</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@500&display=swap"
      rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
  </head>

  <body>
    <header>
      <a class="logo" href="index.html">
        <strong>RE</strong>WATCH
      </a>

      <nav>
        <a href="index.html">Xem website</a>
      </nav>
    </header>

    <main class="admin-page">
      <section class="login-panel" id="login-panel">
        <span class="kicker">REWATCH ADMIN</span>
        <h1>Đăng nhập quản trị</h1>

        <form id="login-form">
          <label for="admin-email">Email</label>
          <input
            id="admin-email"
            type="email"
            autocomplete="email"
            required
          >

          <label for="admin-password">Mật khẩu</label>
          <input
            id="admin-password"
            type="password"
            autocomplete="current-password"
            required
          >

          <button type="submit">Đăng nhập</button>

          <p id="login-message" role="status"></p>
        </form>
      </section>

      <section class="admin-dashboard" id="admin-dashboard" hidden>
        <div class="admin-heading">
          <div>
            <span class="kicker">TRANG QUẢN TRỊ</span>
            <h1>Quản lý giá thu mua</h1>
            <p id="admin-user"></p>
          </div>

          <div class="admin-heading-actions">
            <a href="index.html" target="_blank">Xem website</a>
            <button id="logout-button" type="button">Đăng xuất</button>
          </div>
        </div>

        <div class="admin-toolbar">
          <input
            id="price-search"
            type="search"
            placeholder="Tìm Reference hoặc tên đồng hồ"
          >

          <button id="reload-prices" type="button">
            Tải lại dữ liệu
          </button>
        </div>

        <div class="admin-table-wrapper">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Reference</th>
                <th>Thương hiệu</th>
                <th>Dòng</th>
                <th>Mẫu</th>
                <th>Giá hàng mới</th>
                <th>Giá hàng đã dùng</th>
                <th>Thao tác</th>
              </tr>
            </thead>

            <tbody id="price-table-body"></tbody>
          </table>
        </div>

        <p id="admin-message" role="status"></p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
