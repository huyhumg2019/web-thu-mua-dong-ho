name: Xem trước giá và ảnh Kame

on:
  schedule:
    # 10:00 sáng mỗi ngày theo giờ Nhật (UTC+9).
    - cron: "0 1 * * *"

  pull_request:
    branches:
      - main
    paths:
      - "scripts/sync-kame-prices.mjs"
      - ".github/workflows/kame-price-preview.yml"

  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Ghi giá và ảnh vào Supabase"
        required: true
        type: boolean
        default: false
      jpy_to_vnd_rate:
        description: "Tỷ giá 1 JPY sang VND (để trống để lấy tự động)"
        required: false
        type: string
        default: ""
      buffer_man_yen:
        description: "Số 万円 trừ khỏi giá Kame"
        required: true
        type: string
        default: "20"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Dùng Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kiểm tra bộ đọc Kame trên Pull Request
        if: github.event_name == 'pull_request'
        env:
          APPLY_CHANGES: "false"
          JPY_TO_VND_RATE: "1"
          KAME_BUFFER_MAN_YEN: "20"
        run: node scripts/sync-kame-prices.mjs

      - name: Xem trước hoặc đồng bộ thủ công
        if: github.event_name == 'workflow_dispatch'
        env:
          APPLY_CHANGES: ${{ inputs.apply_changes }}
          JPY_TO_VND_RATE: ${{ inputs.jpy_to_vnd_rate }}
          KAME_BUFFER_MAN_YEN: ${{ inputs.buffer_man_yen }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-kame-prices.mjs

      - name: Đồng bộ tự động mỗi ngày
        if: github.event_name == 'schedule'
        env:
          APPLY_CHANGES: "true"
          JPY_TO_VND_RATE: ""
          KAME_BUFFER_MAN_YEN: "20"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-kame-prices.mjs

      - name: Lưu báo cáo kiểm tra
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kame-sync-report
          path: kame-sync-report.json
          if-no-files-found: warn
          retention-days: 30
